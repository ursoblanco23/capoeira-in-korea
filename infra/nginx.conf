events {}

http {
    upstream frontend {
        server 192.168.97.188:5173;
    }

    upstream backend {
        server 192.168.97.188:8080;
    }

    server {
        listen 443 ssl;
        server_name app.local.test;

        ssl_certificate     /etc/nginx/certs/app.local.test.pem;
        ssl_certificate_key /etc/nginx/certs/app.local.test-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Spring 설정의 max-request-size와 맞춤
        client_max_body_size 150M;

        # 업로드 파일 정적 서빙
        location /upload/ {
            alias /app/upload/;
            access_log off;
            expires 7d;
        }

        # API -> Spring Boot
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Frontend -> Vite dev server
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            # Vite HMR
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}