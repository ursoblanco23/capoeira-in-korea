services:
  nginx:
    image: nginx:1.25-alpine
    container_name: capo-local-nginx
    ports:
      - "443:443"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - /mnt/c/dev/certs:/etc/nginx/certs:ro
      - ./backend/upload:/app/upload:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
