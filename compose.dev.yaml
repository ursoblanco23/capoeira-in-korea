services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: capo-local-postgres

    env_file:
      - ./backend/.env.dev

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  nginx:
    image: nginx:1.25-alpine
    container_name: capo-local-nginx
    ports:
      - "443:443"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/certs/dev:/etc/nginx/certs:ro
      - ./backend/upload:/app/upload:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
